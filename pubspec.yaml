name: crictrack
description: "CricTrack - AI Cricket Ball Tracking App (UI Prototype)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Camera
  camera: ^0.11.1

  # Charts
  fl_chart: ^0.70.2

  # Local storage
  shared_preferences: ^2.3.3

  # Utilities
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  uuid: ^4.5.1
  permission_handler: ^11.3.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
